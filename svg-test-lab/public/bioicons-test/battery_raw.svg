<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- background -->
  <rect x="0" y="0" width="600" height="400" fill="#fdfbf6"/>

  <!-- subtle paper grain (very light) -->
  <path d="M30,70 C80,55 130,85 180,70 C230,55 280,80 330,68 C380,56 430,85 480,70 C530,55 565,65 585,60"
        fill="none" stroke="#efe8d7" stroke-width="3" opacity="0.6"/>
  <path d="M20,330 C90,315 150,345 215,330 C280,315 340,345 405,330 C470,315 530,340 585,325"
        fill="none" stroke="#efe8d7" stroke-width="3" opacity="0.55"/>

  <!-- Battery silhouette -->
  <path d="M150,120
           C140,123 134,132 133,144
           C131,170 131,230 133,256
           C134,270 141,279 153,282
           C170,286 210,288 250,286
           C290,284 324,280 337,276
           C348,273 355,263 356,251
           C358,230 358,170 356,147
           C355,135 349,126 339,123
           C320,117 280,114 245,114
           C210,114 172,116 150,120 Z"
        fill="#e8efe6" stroke="#3a362c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Positive terminal bump -->
  <path d="M340,128
           C346,124 354,124 360,128
           C366,133 366,141 360,146
           C354,151 346,151 340,146
           C334,141 334,133 340,128 Z"
        fill="#f2d3a1" stroke="#3a362c" stroke-width="3" stroke-linejoin="round"/>

  <!-- Internal regions inside battery -->
  <!-- Anode (left) -->
  <path d="M155,133
           C150,140 148,150 148,162
           C147,185 147,220 148,242
           C149,255 153,264 160,270
           C178,281 206,284 232,284
           C232,245 232,172 232,124
           C205,124 176,126 155,133 Z"
        fill="#9cc9c6" stroke="#3a362c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Electrolyte (middle) -->
  <path d="M232,124
           C232,175 232,246 232,284
           C265,284 295,281 315,272
           C322,268 326,260 327,250
           C329,228 329,182 327,155
           C326,146 322,139 315,136
           C295,127 265,124 232,124 Z"
        fill="#cfd7f2" stroke="#3a362c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cathode (right) -->
  <path d="M315,136
           C323,140 330,146 334,154
           C338,162 339,175 339,190
           C340,214 340,230 339,246
           C339,257 336,267 329,273
           C323,279 312,282 300,284
           C320,283 337,280 347,275
           C352,272 355,264 356,255
           C358,233 358,170 356,147
           C355,137 348,129 339,126
           C332,124 324,123 317,123
           C314,128 314,133 315,136 Z"
        fill="#e7b0b7" stroke="#3a362c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Battery + and - marks (hand-drawn) -->
  <path d="M170,110 C176,108 184,108 190,110" fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>
  <path d="M170,110 C176,112 184,112 190,110" fill="none" stroke="#3a362c" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M330,110 C336,110 344,110 350,110" fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>
  <path d="M340,104 C340,108 340,114 340,118" fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>

  <!-- External circuit wire path to device (organic) -->
  <path d="M130,150
           C85,145 65,165 62,190
           C58,224 80,250 120,252
           C150,254 170,265 188,292
           C214,330 265,338 300,326
           C330,315 345,280 370,260
           C395,240 430,238 458,250
           C488,263 510,255 525,235
           C545,209 530,170 500,160
           C470,150 430,160 405,185
           C388,202 370,213 355,217"
        fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection points (small drawn nodes) -->
  <path d="M132,150 C136,146 142,146 146,150 C150,154 150,160 146,164 C142,168 136,168 132,164 C128,160 128,154 132,150 Z"
        fill="#fdfbf6" stroke="#3a362c" stroke-width="2.5"/>
  <path d="M348,217 C352,213 358,213 362,217 C366,221 366,227 362,231 C358,235 352,235 348,231 C344,227 344,221 348,217 Z"
        fill="#fdfbf6" stroke="#3a362c" stroke-width="2.5"/>

  <!-- Device (simple lamp-like load) -->
  <path d="M440,190
           C430,188 421,195 419,206
           C416,221 426,235 442,238
           C459,241 474,232 477,216
           C479,203 470,192 456,190
           C452,189 446,189 440,190 Z"
        fill="#f6e2b6" stroke="#3a362c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M438,238
           C436,250 438,262 445,270
           C452,278 463,282 476,281
           C489,280 499,273 504,263
           C508,254 507,244 501,236
           C493,225 480,220 468,222"
        fill="#f1c77f" stroke="#3a362c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Filament hint -->
  <path d="M434,212
           C441,206 450,206 456,212
           C462,218 471,218 477,212"
        fill="none" stroke="#3a362c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Electron flow dots along wire (from anode to cathode) -->
  <!-- Dots are placed roughly following the wire path, moving left (anode, -) toward right (cathode, +) through external circuit -->
  <circle cx="120" cy="248" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="165" cy="270" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="215" cy="315" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="285" cy="330" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="352" cy="292" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="418" cy="245" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="470" cy="252" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>
  <circle cx="505" cy="220" r="5" fill="#5aa3a0" stroke="#3a362c" stroke-width="2"/>

  <!-- Flow arrow (hand-drawn) -->
  <path d="M285,344
           C308,344 330,338 345,328"
        fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>
  <path d="M346,328
           C340,329 334,330 328,334"
        fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>
  <path d="M346,328
           C342,333 338,338 332,341"
        fill="none" stroke="#3a362c" stroke-width="3" stroke-linecap="round"/>

  <!-- Labels with small background rectangles -->
  <!-- Battery label -->
  <rect x="210" y="84" width="90" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.9"/>
  <text x="255" y="101" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">Battery</text>

  <!-- Anode label -->
  <rect x="155" y="298" width="70" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.92"/>
  <text x="190" y="315" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">Anode (−)</text>

  <!-- Cathode label -->
  <rect x="305" y="298" width="88" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.92"/>
  <text x="349" y="315" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">Cathode (+)</text>

  <!-- External circuit label -->
  <rect x="40" y="120" width="128" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.92"/>
  <text x="104" y="137" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">External circuit</text>

  <!-- Electron flow label -->
  <rect x="380" y="318" width="180" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.92"/>
  <text x="470" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">Electron flow (e⁻)</text>

  <!-- Device label -->
  <rect x="448" y="150" width="112" height="24" rx="6" ry="6" fill="#fdfbf6" opacity="0.92"/>
  <text x="504" y="167" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#20180a">Device (load)</text>
</svg>